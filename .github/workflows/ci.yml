name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model-free test dependencies
        run: python -m pip install numpy==2.4.6 fastapi==0.141.1 jinja2==3.1.6 python-multipart==0.0.32 pypdf==6.17.0 httpx==0.28.1 pytest==9.1.1
      - name: Deterministic tests (no model download)
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -m unittest discover -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU public demo
        run: docker build -t bahith-v2 .
      - name: Start public demo without downloading model for smoke checks
        run: >-
          docker run -d --name bahith-smoke -p 127.0.0.1:7860:7860
          -e BAHITH_ALLOWED_HOSTS=localhost,127.0.0.1
          -e BAHITH_PRELOAD_MODEL=0 bahith-v2
      - name: Verify container routes and public boundaries
        run: python deploy/smoke.py http://127.0.0.1:7860
      - name: Container diagnostics
        if: failure()
        run: docker logs bahith-smoke || true
