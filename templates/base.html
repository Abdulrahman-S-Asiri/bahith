<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}باحث · بحث في الوثائق العربية{% endblock %}</title>
  <meta name="description" content="باحث: بحث دلالي وكلمي في الوثائق العربية مع إظهار المصدر.">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="heritage-band" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="باحث — الصفحة الرئيسية">
        <span>باحث</span><small lang="en" dir="ltr">BAHITH</small>
      </a>
      <nav class="primary" aria-label="التنقل الرئيسي">
        <a href="/">الرئيسية</a>
        <a href="/search">البحث</a>
        <a href="/documents">الوثائق</a>
        <a href="/browse">التصفح</a>
        <a href="/about">عن باحث</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="container">
      {% if message %}<div class="notice notice-success" role="status">{{ message }}</div>{% endif %}
      {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>باحث · كل نتيجة تقودك إلى مصدرها</p>
      <p>مدعوم بنموذج <a href="https://huggingface.co/Omartificial-Intelligence-Space/Harrier-Arabic-Matryoshka-0.6B" target="_blank" rel="noopener" lang="en" dir="ltr">Harrier Arabic Matryoshka</a></p>
    </div>
  </footer>
</body>
</html>
